# Local gate. CI runs the same thing — the difference is that here it costs seconds,
# and there a whole run. We do not bypass hooks: if one gets in the way, we fix the hook.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The NetScaler corpus and the served profile bodies are byte-for-byte captures of a
      # real appliance; their sha256 is pinned in tests. Normalising whitespace or the final
      # newline would corrupt the reference, so these two fixers must not touch them.
      - id: trailing-whitespace
        exclude: '^(tests/data/netscaler_corpus/|src/honeylens/honeypots/netscaler_profiles/)'
      - id: end-of-file-fixer
        exclude: '^(tests/data/netscaler_corpus/|src/honeylens/honeypots/netscaler_profiles/)'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key

  # SECRETS — full history, not just the change. A secret deleted in the next commit
  # is still in the repository.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        pass_filenames: false
        args: [--config-file=pyproject.toml]

  # SAST on push, not on every commit — semgrep is too slow for pre-commit.
  - repo: local
    hooks:
      - id: bandit
        name: bandit (SAST)
        entry: bandit -q -c pyproject.toml -r src
        language: system
        pass_filenames: false
        stages: [pre-push]
