[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeylens"
version = "1.0.0.dev0"
description = "HoneyLens sensor — honeypot fleet, capture, classification and threat intelligence"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Dariusz Gońda", email = "dariusz@honeylens.io" }]

# 3.12: the newest Python in RHEL/Rocky 9 AppStream (target changed from Rocky 10 to
# Rocky 9 on 2026-09-17). Every dependency CVE that Python 3.9 put out of reach needs only
# >=3.10, so 3.12 closes that case in full. Known cost: the python3.12 stream in RHEL 9 is
# listed for retirement in April 2027.
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

# Runtime dependencies of the layers ported so far; the pinned versions live in
# requirements.txt (compiled on the target by `make lock`). Layer 1 (core):
dependencies = [
  "psycopg2-binary>=2.9",  # core.database — pool + cursors
  "requests>=2.32",        # core.siem — HTTP forwarders (loki, splunk, elastic, webhook)
  "geoip2>=4.7",           # core.geoip — MaxMind reader (falls back to ip-api without a DB file)
  # Layer 3 (ingest):
  "scapy>=2.5",            # ingest.ebpf — PCAP parsing for JA3/JA4
  "zstandard>=0.22",       # ingest.pcap_manager — archive compression (the gzip fallback of 0.9 is gone)
  # Layer 4 (analysis, intelligence):
  "aiohttp>=3.14.4",       # attacker_profiler + every web decoy; 3.14.4 = DoS fixes, see requirements.in
  "httpx>=0.28",           # ai_analyzer — Ollama client
  "anthropic>=0.39",       # claude_analyzer — external AI backend (optional at runtime, off by default)
  "cryptography>=46",      # credential_vault — AES-GCM
  # Layer 5 (honeypots):
  "flask>=3.1",            # monolithic honeypot's web decoys
  "asyncssh>=2.21",        # PAN-OS SSH decoy
  "argon2-cffi>=21.3.0",   # layer 6: auth — Argon2id password hashing (PBKDF2 fallback otherwise)
  "fastapi>=0.128",        # K8s / LLM decoys (ASGI apps)
  "uvicorn>=0.39",         # ASGI server for the decoys above
  "python-multipart>=0.0.6",  # layer 6: API login form parsing (FastAPI requires it for request.form())
]

[project.optional-dependencies]
ldap = ["ldap3>=2.9"]          # auth/ldap_auth.py — optional AD/LDAP backend
# Alternative AI backend; unused by default, so we do not pull it onto every sensor.
openai = ["openai>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",        # SCA — advisories against the pinned lock file
  "bandit>=1.7",           # SAST — Python-specific
  "semgrep>=1.90",         # SAST — the same rulesets the gate runs in CI; from the venv, not a stray 3.9 install
  "cyclonedx-bom>=4",      # SBOM, as in 0.9
  "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://honeylens.io"

# Console entry points replace the "cd /opt/sensor && python -m ..." invocations of 0.9.
# That indirection is not cosmetic: 0.9 ships flat top-level packages copied into
# /opt/sensor, so every process depends on the interpreter's working directory being
# right. When it was not, `honeypot_llm` died on "No module named 'core'" and silently
# dropped ten weeks of events — the unit stayed "active" throughout. An installed package
# cannot fail that way.
[project.scripts]
honeylens-migrate = "honeylens.db.migrate:main"   # layer 1: schema migrations
honeylens-geoip   = "honeylens.geoip:main"        # layer 1: IP lookup from the shell
honeylens-ingest-ebpf      = "honeylens.ingest.ebpf:main"          # layer 3: systemd sensor-ingest
honeylens-ingest-honeypot  = "honeylens.ingest.honeypot:main"      # layer 3: systemd sensor-ingest-honeypot
honeylens-ingest-fortigate = "honeylens.ingest.fortigate:main"     # layer 3
honeylens-ingest-paloalto  = "honeylens.ingest.paloalto:main"      # layer 3
honeylens-ingest-suricata  = "honeylens.ingest.suricata:main"      # layer 3
honeylens-pcap-manager     = "honeylens.ingest.pcap_manager:main"  # layer 3: systemd sensor-pcap-manager
honeylens-ai-analyzer      = "honeylens.analysis.ai_analyzer:main"          # layer 4: systemd sensor-ai
honeylens-profiler         = "honeylens.analysis.attacker_profiler:main"    # layer 4: systemd sensor-profiler
honeylens-mitm-detector    = "honeylens.intelligence.mitm_detector:main"    # layer 4: systemd sensor-mitm
honeylens-hp               = "honeylens.honeypots.cli:main"                 # layer 5: honeypot container CMD, --list, --quadlets
honeylens-api              = "honeylens.api:main"                          # layer 6: systemd sensor-api (WebUI + REST)
honeylens-db-archive       = "honeylens.tools.db_archive:main"             # layer 7: systemd sensor-db-retention timer
honeylens-auto-backfill    = "honeylens.tools.auto_backfill:main"          # layer 7: systemd timer 01:00, reclassify when rules change
honeylens-classification-tunning = "honeylens.tools.classification_tunning:main"  # layer 7: review tool, raises mis-classifications
honeylens-repair-netscaler-tags = "honeylens.tools.repair_netscaler_tags:main"    # layer 7: one-off, regenerate decoy ns-* tags from stored metadata
honeylens-refresh-stats    = "honeylens.tools.refresh_stats:main"                 # layer 7: systemd timer 5min, refresh mv_event_stats for the dashboard KPIs
honeylens-ics-attack       = "honeylens.tools.ics_attack_simulator:main"    # phase 4: OT attack simulator (read-only by default)
honeylens-migrate-sensor   = "honeylens.tools.migrate_sensor:main"          # phase 5: migrator 0.9 -> 1.0 (dry-run by default)
honeylens-ttl-deception    = "honeylens.ebpf.ebpf_ttl_loader:main"          # layer 8: systemd sensor-ttl-deception (root)
honeylens-ttl-profiler     = "honeylens.ebpf.ttl_profiler:main"             # layer 8: TTL/window baseline (diagnostics)
honeylens-blog-publisher   = "honeylens.publishing.blog_publisher:main"     # layer 8: report publishing (opt-in)
# honeylens-ingest   = "honeylens.ingest.cli:main"
# (uncommented as each subsystem is ported)

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migrations ship inside the package: an installed sensor has no repo checkout to read
# them from. The runner discovers them relative to its own module.
"honeylens.db" = ["migrations/*.sql"]
# Mapping of attack patterns to MITRE techniques; the operator can override it with a copy in DATA_DIR.
"honeylens" = ["data/*.json", "data/*.sql"]
# Web UI graphics served by the API (favicon, logo).
"honeylens.webui" = ["*.png", "*.ico"]
# eBPF program sources (TC egress + dissection) — the loader reads them next to the module.
"honeylens.ebpf" = ["*.c"]
# Measured NetScaler response bodies replayed byte-for-byte by netscaler_profile._load; they
# must ship in the wheel/image or the honeypot crashes on import for want of its corpus.
"honeylens.honeypots" = ["netscaler_profiles/*/*.body", "netscaler_profiles/*/*.html"]

# ─────────────────────────────── ruff ───────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # import sorting
  "UP",         # pyupgrade — flags 3.9-era idioms the port should drop
  "B",          # bugbear
  "S",          # flake8-bandit: security smells at lint speed
  "ASYNC",      # async pitfalls — the honeypots are async-heavy
  "DTZ",        # naive datetimes. 0.9 lost a day to UTC-vs-local NOW() mismatches
  "LOG", "G",   # logging correctness
  "PTH",        # pathlib over os.path
  "RUF",
]
ignore = [
  "E501",       # line length is handled by the formatter
  "S101",       # assert — fine in tests
]

[tool.ruff.lint.per-file-ignores]
# Honeypots deliberately contain decoy credentials and weak-looking constructs: that is
# the product, not a defect. Real secrets are caught by gitleaks, which reads .env-shaped
# files and application code, not the bait.
# In addition: listening on 0.0.0.0 is the point of a honeypot (S104); randomness serves impersonation, not
# cryptography (S311); os.path as in the ingest daemons — debt for a separate task (PTH).
"src/honeylens/honeypots/*" = ["S104", "S105", "S106", "S107", "S311", "PTH"]
"src/honeylens/honeypots/*/*" = ["S104", "S105", "S106", "S107", "S311", "PTH"]
# FastAPI: `Depends()` in default arguments is the framework's idiom (B008).
"src/honeylens/auth/admin_routes.py" = ["B008"]
# PTH in tests: tests moved from 0.9 speak os.path, and rewriting them to pathlib checks
# nothing; new tests are written on pathlib anyway.
"tests/*" = ["S", "DTZ", "PTH"]
# The 0.9 ingest daemons speak os.path, and their paths flow into psycopg2, glob and tests as
# str. Rewriting to pathlib is a separate task with tests;
# state.py and logcleanup.py — the offset and cleanup contract — are already on pathlib.
"src/honeylens/ingest/ebpf.py" = ["PTH"]
"src/honeylens/ingest/honeypot.py" = ["PTH"]
"src/honeylens/ingest/pcap_manager.py" = ["PTH"]
"src/honeylens/ingest/paloalto.py" = ["PTH"]
"src/honeylens/ingest/fortigate.py" = ["PTH"]
"src/honeylens/ingest/suricata.py" = ["PTH"]
# Layer 4: the same — daemons and API clients speak os.path; whitelist.py is on pathlib.
"src/honeylens/analysis/ai_analyzer.py" = ["PTH"]
"src/honeylens/analysis/attacker_profiler.py" = ["PTH"]
"src/honeylens/analysis/claude_analyzer.py" = ["PTH"]
"src/honeylens/intelligence/apt_attribution.py" = ["PTH"]
"src/honeylens/intelligence/circl_enricher.py" = ["PTH"]
"src/honeylens/intelligence/host_recon.py" = ["PTH"]
"src/honeylens/intelligence/mitm_detector.py" = ["PTH"]
# Phase 2 validation probes: run by hand as root on a test host, not in the product.
"scripts/*" = ["S"]
# Operator/pentester tool run deliberately from the CLI (like src/honeylens/tools/*);
# UP031 printf formatting in operator-facing messages is deferred modernisation, not a port.
"scripts/sharepoint_cve_checker.py" = ["S", "UP031"]
# Layer 7: operator/pentester tools (run deliberately from the CLI, like scripts/).
# UP031 — printf formatting in operator messages (modernisation deferred);
# PTH — os.path as in the ingest daemons; S codes — bind on 0.0.0.0
# (OT simulators listen), subprocess with an argument list (pg_dump, systemctl, openssl),
# urllib to a configured URL (Ollama), made-up passwords in honeypot testers, SQL assembled
# from constants. Each of these S codes is a use-with-a-reason, not a hole.
# E402: CLI scripts do `try: import … except ImportError: sys.exit(...)` (fail-fast with
# a message), so some imports necessarily come after that code.
"src/honeylens/tools/*" = ["UP031", "PTH", "E402", "S104", "S105", "S106", "S107", "S108", "S310", "S602", "S603", "S607", "S608"]
# Layer 8: eBPF loaders run as root natively (not in a container), with the kernel
# and tc. PTH — os.path as in the daemons; S603/S607 — tc/subprocess with an argument list
# (the safe form); S104 — INTERFACE bind. These are operator tools, like scripts/.
"src/honeylens/ebpf/*" = ["PTH", "S603", "S607", "S104"]

# ─────────────────────────────── mypy ───────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Not strict on day one: 105k lines arrive over time and a wall of red on the first
# ported module teaches nothing. Strictness is raised per package as each one lands.
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# scapy.all assembles its namespace dynamically (import * from layers), so mypy does not see
# IP/TCP/UDP as attributes; with no types and no sensible stub — we skip analysis of that package.
[[tool.mypy.overrides]]
module = "scapy.*"
follow_imports = "skip"
ignore_missing_imports = true

# Layer 7: operator CLI tools. Per the "strictness raised per package" rule,
# full typing of these 32 scripts is a separate task —
# they are guarded by behaviour tests (db_archive), not by annotations. We do not check the bodies of
# unannotated functions; signatures and imports are still checked.
[[tool.mypy.overrides]]
module = "honeylens.tools.*"
check_untyped_defs = false

# ────────────────────────────── pytest ──────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs a live service (database, honeypot listener)",
  "slow: takes more than a second",
  # classifier test markers moved from 0.9 (pytest.ini)
  "text_golden: text-payload detection goldens",
  "binary_golden: binary-protocol detection goldens",
  "edge: gate/boundary edge cases",
  "scoring: scoring layer smoke",
]

# ────────────────────────────── bandit ──────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B104 (bind 0.0.0.0), B105 (hardcoded password), B311 (random): ruff has the same checks as
# S104/S105/S311 with per-file exclusions (honeypots listen everywhere, the bait is
# made-up passwords, randomness serves the device identity, not cryptography). Bandit cannot
# disable rules per directory, and 60 # nosec markers in the honeypots are noise, not control.
# B106/B107 (password in a call/default argument): like B105 — bait and default
# credentials of honeypot testers, not secrets. B404/B603/B607 (subprocess): throughout the
# code we call with an argument list and no shell (the safe form that bandit itself
# recommends) — flagging "partial path" for systemctl/pg_dump/openssl is noise under our
# threat model. Secrets are caught by gitleaks; shell injection — no shell=True.
skips = ["B104", "B105", "B106", "B107", "B311", "B404", "B603", "B607"]
